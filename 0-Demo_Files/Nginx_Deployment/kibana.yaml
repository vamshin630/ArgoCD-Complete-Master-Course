apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kibana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.elastic.co
    chart: kibana
    targetRevision: 8.12.2 # Use the latest version or your preferred one
    helm:
      values: |
        elasticsearchHosts: "http://elasticsearch-master.elasticsearch.svc.cluster.local:9200"
  destination:
    server: https://kubernetes.default.svc
    namespace: kibana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
